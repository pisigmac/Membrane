services:
  membrane:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - membrane_data:/data
    command: >
      bash -lc "pip install -e '.[api]' -q &&
      membrane init --root /data &&
      membrane serve --host 0.0.0.0 --port 8787 --root /data"
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEMBRANE_ROOT: /data
      # Connects to DeskID on the host (local dev) or an external service (remote).
      MEMBRANE_AUTH_JWKS_URL: ${MEMBRANE_AUTH_JWKS_URL:-http://host.docker.internal:8090/.well-known/jwks.json}
      MEMBRANE_AUTH_ISSUER: ${MEMBRANE_AUTH_ISSUER:-https://auth.deskid.local}
      MEMBRANE_AUTH_AUDIENCE: ${MEMBRANE_AUTH_AUDIENCE:-membrane}
      MEMBRANE_CORS_ORIGINS: ${MEMBRANE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

volumes:
  membrane_data:
